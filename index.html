<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4e79a7" />

    <title>Embedding Analytics — compare how documents use the same word</title>
    <meta
      name="description"
      content="Two authors can use the same word and mean different things by it. See which terms a set of documents agree on, and which they place inconsistently."
    />
    <link rel="canonical" href="https://www.embedding-analytics.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Embedding Analytics" />
    <meta property="og:url" content="https://www.embedding-analytics.com/" />
    <meta
      property="og:title"
      content="Embedding Analytics — compare how documents use the same word"
    />
    <meta
      property="og:description"
      content="Two authors can use the same word and mean different things by it. See which terms a set of documents agree on, and which they place inconsistently."
    />

    <!--
      og-image.png is 1062x681 (1.56). Cards are laid out for 1200x630 (1.91),
      so it letterboxes slightly rather than filling edge to edge. Recropping to
      1.91 is the only thing left to make it render flush.
    -->
    <!--
      Only twitter:card is needed: the card parser falls back to og:title,
      og:description and og:image, so mirroring those here would just be a
      second copy of the same sentences to keep in sync.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      property="og:image"
      content="https://www.embedding-analytics.com/og-image.png"
    />
    <meta property="og:image:width" content="1062" />
    <meta property="og:image:height" content="681" />
    <meta
      property="og:image:alt"
      content="The query &quot;value&quot; read across five books, 1767 to 1850."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
